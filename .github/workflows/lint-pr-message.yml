name: lint-pr-message
on:
  workflow_call:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
