name: validate-bun-executable-pr
on:
  workflow_call:
    inputs:
      minify:
        description: "Minify the compiled executable (whitespace and syntax only, identifiers are not renamed)"
        required: false
        type: boolean
        default: true
      sourcemap:
        description: "Embed a zstd-compressed sourcemap in the compiled executable so errors and stack traces point to original source locations (increases executable size). Enabled by default; disable with `sourcemap: false`"
        required: false
        type: boolean
        default: true
      bytecode:
        description: "Precompile JavaScript to bytecode at build time to shorten executable startup (increases build time and executable size). Disabled by default because Bun's --bytecode fails on projects that use top-level await (oven-sh/bun#40968); projects without top-level await can enable it with `bytecode: true`"
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false # if not provided codecov will not be run
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Bun Source
        uses: flowscripter/.github/actions/check-bun-source@v1
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest, windows-latest, ubuntu-latest, windows-11-arm, ubuntu-24.04-arm]
    steps:
      - name: Run Bun Tests
        uses: flowscripter/.github/actions/run-bun-tests@v1
  test-executable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest, windows-latest, ubuntu-latest, windows-11-arm, ubuntu-24.04-arm]
    steps:
      - name: Run Bun Executable Tests
        uses: flowscripter/.github/actions/run-bun-executable-tests@v1
        with:
          minify: ${{ inputs.minify }}
          sourcemap: ${{ inputs.sourcemap }}
          bytecode: ${{ inputs.bytecode }}
