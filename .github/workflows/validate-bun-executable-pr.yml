name: validate-bun-executable-pr
on:
  workflow_call:
    inputs:
      minify:
        description: "Minify the compiled executable (whitespace and syntax only, identifiers are not renamed)"
        required: false
        type: boolean
        default: true
      sourcemap:
        description: "Embed a zstd-compressed sourcemap in the compiled executable so errors and stack traces point to original source locations (increases executable size). Enabled by default; disable with `sourcemap: false`"
        required: false
        type: boolean
        default: true
      bytecode:
        description: "Precompile JavaScript to bytecode at build time to shorten executable startup (increases build time and executable size). Enabled by default and built as ESM (`--format=esm`), because Bun's `--bytecode` otherwise forces CommonJS output, which cannot compile top-level await (oven-sh/bun#40968); disable with `bytecode: false`"
        required: false
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false # if not provided codecov will not be run
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        shell: bash
        run: |
          docs_only=false
          if files=$(git diff --name-only HEAD^1 HEAD 2>/dev/null) && [ -n "$files" ]; then
            grep -qvE '^(docs/changes/|docs/adr/|\.claude/)|(^|/)CLAUDE\.md$' <<<"$files" || docs_only=true
          fi
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"
  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check Bun Source
        if: needs.changes.outputs.docs-only != 'true'
        uses: flowscripter/.github/actions/check-bun-source@v1
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
  test:
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest, windows-latest, ubuntu-latest, windows-11-arm, ubuntu-24.04-arm]
    steps:
      - name: Run Bun Tests
        if: needs.changes.outputs.docs-only != 'true'
        uses: flowscripter/.github/actions/run-bun-tests@v1
  test-executable:
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest, windows-latest, ubuntu-latest, windows-11-arm, ubuntu-24.04-arm]
    steps:
      - name: Run Bun Executable Tests
        if: needs.changes.outputs.docs-only != 'true'
        uses: flowscripter/.github/actions/run-bun-executable-tests@v1
        with:
          minify: ${{ inputs.minify }}
          sourcemap: ${{ inputs.sourcemap }}
          bytecode: ${{ inputs.bytecode }}
