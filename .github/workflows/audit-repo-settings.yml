name: audit-repo-settings
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit repository settings
        run: python3 scripts/repo-settings.py audit
        env:
          GH_TOKEN: ${{ secrets.AUDIT_REPO_TOKEN }}
