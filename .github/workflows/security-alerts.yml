name: security-alerts
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check security alerts and settings
        run: python3 scripts/security-audit.py alerts
        env:
          GH_TOKEN: ${{ secrets.SECURITY_AUDIT_TOKEN }}
