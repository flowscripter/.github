name: run-bun-executable-tests
description: 'Run Bun executable tests'
inputs:
  minify:
    description: "Minify the compiled executable (whitespace and syntax only, identifiers are not renamed)"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Checkout source
      uses: actions/checkout@v6
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "latest"
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14
    - name: Behave Tests
      run: |
        bun ci
        bun build index.ts --compile ${{ inputs.minify == 'true' && '--minify-whitespace --minify-syntax' || '' }} --outfile functional_tests/executable
        cd functional_tests 
        pip3 install -r pip-requirements.txt
        export EXECUTABLE=./executable
        behave
      shell: bash
