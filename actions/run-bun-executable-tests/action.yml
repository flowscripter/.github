name: run-bun-executable-tests
description: 'Run Bun executable tests'
inputs:
  minify:
    description: "Minify the compiled executable (whitespace and syntax only, identifiers are not renamed)"
    required: false
    default: "true"
  sourcemap:
    description: "Embed a zstd-compressed sourcemap in the compiled executable so errors and stack traces point to original source locations (increases executable size). Enabled by default; disable with `sourcemap: false`"
    required: false
    default: "true"
  bytecode:
    description: "Precompile JavaScript to bytecode at build time to shorten executable startup (increases build time and executable size). Disabled by default because Bun's --bytecode fails on projects that use top-level await (oven-sh/bun#40968); projects without top-level await can enable it with `bytecode: true`"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Checkout source
      uses: actions/checkout@v6
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "latest"
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14
    - name: Behave Tests
      run: |
        bun ci
        bun build index.ts --compile ${{ inputs.minify == 'true' && '--minify-whitespace --minify-syntax' || '' }} ${{ inputs.sourcemap == 'true' && '--sourcemap' || '' }} ${{ inputs.bytecode == 'true' && '--bytecode' || '' }} --outfile functional_tests/executable
        cd functional_tests 
        pip3 install -r pip-requirements.txt
        export EXECUTABLE=./executable
        behave
      shell: bash
