name: run-bun-webapp-tests
description: 'Run Bun Webapp Tests'
runs:
  using: "composite"
  steps:
    - name: Checkout source
      uses: actions/checkout@v7
    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "latest"
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14
    - name: Add preinstalled geckodriver to PATH
      run: echo "$GECKOWEBDRIVER" >> "$GITHUB_PATH"
      shell: bash
    - name: Behave Tests
      run: |
        bun ci
        if jq -e '.scripts.build' package.json > /dev/null 2>&1; then
          bun run build
        fi
        cd functional_tests
        pip3 install -r pip-requirements.txt
        behave
      shell: bash
