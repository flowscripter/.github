name: run-bun-webapp-tests
description: 'Run Bun Webapp Tests'
runs:
  using: "composite"
  steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "latest"
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: 3.14
    - name: Add preinstalled geckodriver to PATH
      run: echo "$GECKOWEBDRIVER" >> "$GITHUB_PATH"
      shell: bash
    - name: Behave Tests
      run: |
        bun ci
        if jq -e '.scripts.build' package.json > /dev/null 2>&1; then
          bun run build
        fi
        cd functional_tests
        pip3 install -r pip-requirements.txt
        behave
      shell: bash
