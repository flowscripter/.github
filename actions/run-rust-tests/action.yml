name: run-rust-tests
description: 'Run Rust Tests'
runs:
  using: "composite"
  steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Run tests
      run: |
        rustup default nightly
        cargo clean
        cargo test
      shell: bash
